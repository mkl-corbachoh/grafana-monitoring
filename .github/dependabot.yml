# Ordinary updates are monthly; security updates are enabled in repository settings.
# Major updates remain individual PRs. No automatic merge is configured.
version: 2
updates:
- package-ecosystem: docker-compose
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
