groups:
  - name: mkit-travel-availability
    rules:
      - alert: MKitTravelApiHealthDown
        expr: probe_success{job="blackbox-http", service="api"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: MKit Travel API health is down
          description: Blackbox probe to https://api.mikorh.com/health has failed for more than 2 minutes.

      - alert: MKitTravelFrontendDown
        expr: probe_success{job="blackbox-http", service="frontend"} == 0
        for: 2m
        labels:
          severity: critical
          service: frontend
        annotations:
          summary: MKit Travel frontend is down
          description: Blackbox probe to https://travel.mikorh.com has failed for more than 2 minutes.

      - alert: MKitTravelTlsCertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 14 * 24 * 60 * 60
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: TLS certificate expires in less than 14 days
          description: Certificate for {{ $labels.instance }} expires soon.

  - name: mkit-travel-host
    rules:
      - alert: HostDiskUsageHigh
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host disk usage is over 80%
          description: Filesystem {{ $labels.mountpoint }} is over 80% full.

      - alert: HostDiskUsageCritical
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Host disk usage is over 90%
          description: Filesystem {{ $labels.mountpoint }} is over 90% full.

  - name: mkit-travel-containers
    rules:
      - alert: MKitTravelApiContainerMissing
        expr: absent(container_last_seen{name="mkit-travel-api-1"}) or (time() - container_last_seen{name="mkit-travel-api-1"} > 120)
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: MKit Travel API container is not running
          description: cAdvisor has not seen mkit-travel-api-1 recently.

      - alert: MKitTravelDbContainerMissing
        expr: absent(container_last_seen{name="mkit-travel-db-1"}) or (time() - container_last_seen{name="mkit-travel-db-1"} > 120)
        for: 2m
        labels:
          severity: critical
          service: db
        annotations:
          summary: MKit Travel DB container is not running
          description: cAdvisor has not seen mkit-travel-db-1 recently.
