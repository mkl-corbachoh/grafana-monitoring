groups:
  - name: mkit-travel-dev-availability
    rules:
      - alert: MKitTravelApiHealthDown
        expr: probe_success{job="blackbox-http", service="api"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: MKit Travel API health is down
          description: Blackbox probe to https://api.mikorh.com/health has failed for more than 2 minutes.

      - alert: MKitTravelFrontendDown
        expr: probe_success{job="blackbox-http", service="frontend"} == 0
        for: 2m
        labels:
          severity: critical
          service: frontend
        annotations:
          summary: MKit Travel frontend is down
          description: Blackbox probe to https://travel.mikorh.com has failed for more than 2 minutes.

      - alert: MKitTravelTlsCertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 14 * 24 * 60 * 60
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: TLS certificate expires in less than 14 days
          description: Certificate for {{ $labels.instance }} expires soon.
