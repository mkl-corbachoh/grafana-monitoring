global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: mkit-travel
    environment: dev

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.mikorh.com/health
        labels:
          service: api
          domain: api.mikorh.com
      - targets:
          - https://travel.mikorh.com
        labels:
          service: frontend
          domain: travel.mikorh.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
